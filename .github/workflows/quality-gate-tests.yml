name: Quality Gate Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Quality Gate
        run: python -m py_compile src/quality_gate.py src/backtest.py
      - name: Run Quality Gate Tests
        run: pytest -q tests/test_quality_gate.py
