name: RY APEX V2 Tests
on:
  pull_request:
    paths:
      - 'ry_apex_v2/**'
      - 'tests_v2/**'
      - 'requirements-v2.txt'
      - '.github/workflows/ry-apex-v2-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-v2.txt
      - run: python -m pytest -q tests_v2
