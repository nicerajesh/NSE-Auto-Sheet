name: RY PIT Membership Audit

on:
  push:
    branches: ['research/**']
    paths:
      - 'src/pit_universe.py'
      - 'src/pit_audit.py'
      - '.github/workflows/pit-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run PIT membership audit
        run: python src/pit_audit.py
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pit-membership-audit
          path: output/pit_audit/*
          if-no-files-found: error
          retention-days: 90
