name: RY APEX Daily

on:
  push:
    branches:
      - ry-apex-v2-rebuild
    paths:
      - '.github/workflows/manual-run-trigger.txt'
  schedule:
    - cron: '45 14 * * 1-5'      # 20:15 IST, Mon-Fri (NSE bhavcopy aa chuka hota hai)
  workflow_dispatch:
    inputs:
      rebuild_history:
        description: 'History cache dobara bana do (eod2 se fresh download)'
        type: boolean
        default: false
      clean_extra_tabs:
        description: 'ACTION PLAN / SYSTEM STATUS ke alawa baaki Google Sheet tabs delete karo'
        type: boolean
        default: false

concurrency:
  group: nse-daily
  cancel-in-progress: false

permissions:
  contents: write     # sirf data/signal_ledger.csv commit karne ke liye

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Restore history + ledger cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: nse-state-v2-none
          restore-keys: nse-state-v2-

      - name: Restore ledger from repo (cache evict ho gaya ho to)
        run: |
          mkdir -p state
          if [ ! -f state/signal_ledger.csv ] && [ -f data/signal_ledger.csv ]; then cp data/signal_ledger.csv state/signal_ledger.csv; fi

      - name: Run engine and publish
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CLEAN_EXTRA_TABS: ${{ inputs.clean_extra_tabs && '1' || '0' }}
          CAPITAL_BASE: ${{ vars.CAPITAL_BASE }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_CONCURRENT_POSITIONS: ${{ vars.MAX_CONCURRENT_POSITIONS }}
          DELIVERY_CAPITAL: ${{ vars.DELIVERY_CAPITAL }}
          PUBLISH_RESEARCH_TABS: ${{ vars.PUBLISH_RESEARCH_TABS }}
        run: python src/run.py ${{ inputs.rebuild_history && '--rebuild-history' || '' }}

      - name: Save history + ledger cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state
          key: nse-state-v2-${{ github.run_id }}

      - name: Commit ledger (cache evict ho to bhi live scoreboard bacha rahe; repo bhi 'active' rehta hai)
        if: success()
        run: |
          mkdir -p data
          cp state/signal_ledger.csv data/signal_ledger.csv 2>/dev/null || true
          git config user.name "ry-apex-bot"
          git config user.email "ry-apex-bot@users.noreply.github.com"
          git add data/signal_ledger.csv
          git diff --cached --quiet || (git commit -m "ledger $(date -u +%F)" && git push)

      - name: Upload CSV outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ry-apex-output
          path: output/*.csv
          if-no-files-found: warn
          retention-days: 14
