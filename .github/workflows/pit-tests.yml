name: RY PIT Research Tests

on:
  push:
    branches: ['research/**']
    paths:
      - 'src/pit_universe.py'
      - 'tests/test_pit_universe.py'
      - '.github/workflows/pit-tests.yml'
  pull_request:
    paths:
      - 'src/pit_universe.py'
      - 'tests/test_pit_universe.py'
      - '.github/workflows/pit-tests.yml'

permissions:
  contents: read

jobs:
  pit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src
      - run: python -m pytest -q tests/test_pit_universe.py
