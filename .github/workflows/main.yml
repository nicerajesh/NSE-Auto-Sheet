name: Update NSE Stocks to Google Sheet

on:
  schedule:
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
      NSE_OUTPUT_DIR: ${{ github.workspace }}/output
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Engine
        run: |
          echo '=== NSE EARLY HUNTER — PROFIT-OPTIMIZED DECISION ENGINE ==='
          echo "COMMIT=$(git rev-parse HEAD)"
          PYTHONPATH=src python -m py_compile src/config.py src/indicator.py src/strategy.py src/backtest.py src/quality_gate.py src/d1_database.py src/trade_manager.py src/persistent_runner.py src/persistent_runner_safe.py src/v3_engine.py src/v3_runner.py src/decision_engine.py src/v3_dashboard.py src/update_sheet.py src/finalize_outputs.py src/dashboard.py src/repair_sheet_output.py tests/test_system.py src/csv_utils.py src/risk_manager.py src/corporate_actions.py src/edge_monitor.py src/master_decision.py src/run_v2_master.py
          PYTHONPATH=src python - <<'PY'
          from decision_engine import BUY_NOW, BUY_BREAKOUT, BUY_DIP, WAIT, AVOID
          print('USER_ACTIONS=', [BUY_NOW, BUY_BREAKOUT, BUY_DIP, WAIT, AVOID])
          print('DECISION_ENGINE=enabled')
          print('UPSIDE_BANDS=enabled')
          print('CHASE_PROTECTION=enabled')
          PY
      - name: Unit Tests
        run: |
          PYTHONPATH=src python tests/test_system.py
          PYTHONPATH=src pytest -q tests/test_system.py
      - name: Validate Secrets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          test -n "$GCP_CREDENTIALS" || (echo 'GCP_CREDENTIALS missing' && exit 1)
      - name: Prepare Output
        run: |
          rm -rf "$NSE_OUTPUT_DIR"
          mkdir -p "$NSE_OUTPUT_DIR"
          echo "NSE_OUTPUT_DIR=$NSE_OUTPUT_DIR"
          test -d "$NSE_OUTPUT_DIR"
      - name: Restore Persistent NSE History
        uses: actions/cache/restore@v4
        with:
          path: output/persistent_history.csv
          key: nse-persistent-history-v1
          restore-keys: |
            nse-persistent-history-v1
      - name: Verify Source Layout
        run: |
          test -f src/update_sheet.py
          test -f src/persistent_runner.py
          test -f src/v3_runner.py
          echo 'SOURCE LAYOUT OK: update_sheet.py is under src/'
          if [ -f update_sheet.py ]; then echo 'WARNING: legacy root update_sheet.py exists; src/ version will be used'; fi
      - name: Prepare Universal Source Compatibility
        run: |
          cp src/update_sheet.py update_sheet.py
          test -f update_sheet.py
          echo 'UNIVERSAL SOURCE COMPATIBILITY OK'
      - name: Run V3 Persistent NSE Engine
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          HISTORY_DAYS: 480
          WATCH_MIN_SCORE: 75
          PERSISTENT_D1: '0'
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: src
          NSE_OUTPUT_DIR: ${{ github.workspace }}/output
          PAPER_MODE: ${{ vars.PAPER_MODE || '1' }}
        run: python src/v3_runner.py
      - name: Guarantee Early Hunter CSV
        run: |
          mkdir -p output
          if [ ! -s output/early_hunter.csv ]; then
            echo 'WARNING: early_hunter.csv missing/empty after engine.'
            if [ -s output/decision_candidates.csv ]; then
              echo 'Using decision_candidates.csv as the emergency Early Hunter export.'
              cp output/decision_candidates.csv output/early_hunter.csv
            else
              echo 'No decision_candidates.csv available; creating canonical empty Early Hunter CSV.'
              printf '%s\n' 'SYMBOL,DATE,CMP,ACTION,CATEGORY,NEXT_DAY_ACTION,BUY_DATE,STAGE,PRE_BREAKOUT_SCORE,BREAKOUT_SCORE,SWING_SCORE,HUNTER_SCORE,NEXT_DAY_SETUP_SCORE,BREAKOUT_PROBABILITY,MARKET_REGIME,MARKET_BREADTH,TREND,RS_VS_UNIVERSE,RS_RANK,ENTRY_PRICE,ENTRY_ZONE,BREAKOUT_TRIGGER,STOP_LOSS,TARGET_1,TARGET_2,TARGET_3,RISK_PCT,RISK_MANAGER_STATUS,REASONS' > output/early_hunter.csv
            fi
          fi
          test -s output/early_hunter.csv
          echo "EARLY_HUNTER_OUTPUT=$(realpath output/early_hunter.csv)"
          echo '=== OUTPUT FILES AFTER ENGINE ==='
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Validate Persistent History
        run: |
          test -f output/persistent_history.csv
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('output/persistent_history.csv')
          required={'DATE','SYMBOL','CLOSE_PRICE'}
          missing=required-set(p.columns)
          if missing: raise SystemExit('Missing persistent history fields: '+','.join(sorted(missing)))
          print('PERSISTENT_HISTORY_ROWS=',len(p),'SESSIONS=',p['DATE'].nunique(),'SYMBOLS=',p['SYMBOL'].nunique())
          PY
      - name: Save Persistent NSE History
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/persistent_history.csv
          key: nse-persistent-history-v1-${{ github.run_id }}
      - name: Finalize Quality Gate and Outputs
        run: python src/finalize_outputs.py
      - name: Validate Decision Outputs
        run: |
          set -e
          required_files=(early_hunter.csv buy_candidates.csv decision_candidates.csv trading_commands.csv master_buy_decision_v2.csv low52_reversal.csv apex_matrix.csv stealth_accumulation.csv low52_backtest_summary.csv apex_backtest_summary.csv stealth_backtest_summary.csv)
          for f in "${required_files[@]}"; do
            if [ ! -s "output/$f" ]; then
              echo "MISSING_OR_EMPTY: output/$f"
              echo '=== OUTPUT DIRECTORY ==='
              ls -lah output || true
              exit 1
            fi
          done
          python - <<'PY'
          import pandas as pd
          e=pd.read_csv('output/early_hunter.csv')
          d=pd.read_csv('output/decision_candidates.csv')
          c=pd.read_csv('output/trading_commands.csv')
          l=pd.read_csv('output/low52_reversal.csv')
          lb=pd.read_csv('output/low52_backtest_summary.csv')
          ab=pd.read_csv('output/apex_backtest_summary.csv')
          sb=pd.read_csv('output/stealth_backtest_summary.csv')
          m=pd.read_csv('output/master_buy_decision_v2.csv')
          print('EARLY_HUNTER_ROWS=',len(e))
          print('DECISION_ROWS=',len(d))
          print('TRADING_COMMAND_ROWS=',len(c))
          print('V2_MASTER_ROWS=',len(m))
          print('LOW52_REVERSAL_ROWS=',len(l))
          print('LOW52_BACKTEST_TRADES=',lb.get('trades',[0])[0] if not lb.empty else 0, '| PF=',lb.get('profit_factor',[None])[0] if not lb.empty else None)
          print('APEX_BACKTEST_TRADES=',ab.get('trades',[0])[0] if not ab.empty else 0, '| PF=',ab.get('profit_factor',[None])[0] if not ab.empty else None)
          print('STEALTH_BACKTEST_TRADES=',sb.get('trades',[0])[0] if not sb.empty else 0, '| PF=',sb.get('profit_factor',[None])[0] if not sb.empty else None)
          required=['V3_TIMING_SCORE','V3_OPPORTUNITY_SCORE','BREAKOUT_CHANCE_PCT','UPSIDE_EXPECTED_PCT','UPSIDE_BEST_CASE_PCT','USER_ACTION','IDEAL_ENTRY','BUY_ZONE','MAX_BUY_PRICE']
          missing=[x for x in required if x not in d.columns]
          if missing: raise SystemExit('Missing decision fields: '+','.join(missing))
          if not c.empty: print(c.head(15).to_string(index=False))
          PY
      - name: Validate V2 Master Decision
        run: |
          test -f output/master_buy_decision_v2.csv
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('output/master_buy_decision_v2.csv')
          required=['RANK','SYMBOL','FINAL_ACTION','QUALITY_GATE']
          missing=[x for x in required if x not in d.columns]
          if missing: raise SystemExit('Missing V2 master fields: '+','.join(missing))
          bad=d[d.FINAL_ACTION.str.contains('BUY',na=False) & ~d.FINAL_ACTION.str.contains('BLOCKED',na=False)]
          if not bad.empty and (d.loc[bad.index,'QUALITY_GATE'].astype(str)!='PASS').any():
              raise SystemExit('V2 master published BUY without PASS quality gate')
          print('V2 MASTER ROWS=',len(d),'| RELEASED BUY=',len(bad))
          PY
      - name: Repair Google Sheet Output
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          PYTHONUNBUFFERED: '1'
        run: python src/repair_sheet_output.py
      - name: Build Trading Dashboard
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          PYTHONUNBUFFERED: '1'
        run: python src/dashboard.py
      - name: Verify Outputs
        run: |
          required_files=(early_hunter.csv buy_candidates.csv dashboard.csv trade_ledger.csv decision_candidates.csv trading_commands.csv low52_reversal.csv apex_matrix.csv stealth_accumulation.csv master_buy_dashboard.csv low52_backtest_summary.csv apex_backtest_summary.csv stealth_backtest_summary.csv edge_monitor.csv walk_forward_summary.csv corporate_actions_detected.csv mera_action_plan.csv)
          for f in "${required_files[@]}"; do test -s "output/$f" || { echo "MISSING_OR_EMPTY: output/$f"; ls -lah output || true; exit 1; }; done
      - name: Show Master Buy Dashboard
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/master_buy_dashboard.csv')
          if df.empty: print('NO PUBLISHED BUYS FROM ANY SCANNER TODAY')
          else: print(df.head(30).to_string(index=False))
          PY
      - name: Show APEX Matrix Candidates
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/apex_matrix.csv')
          if df.empty: print('NO APEX MATRIX SETUPS TODAY')
          else: print(df.head(30).to_string(index=False))
          PY
      - name: Show 52-Week-Low Reversal Candidates
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/low52_reversal.csv')
          if df.empty: print('NO STOCKS CURRENTLY NEAR 52-WEEK LOW WITH A REVERSAL SIGNAL')
          else: print(df.head(30).to_string(index=False))
          PY
      - name: Show Stealth Accumulation Candidates
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/stealth_accumulation.csv')
          if df.empty: print('NO STEALTH ACCUMULATION SETUPS TODAY')
          else: print(df.head(30).to_string(index=False))
          PY
      - name: Show Trading Commands
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/trading_commands.csv')
          if df.empty: print('NO CURRENT TRADING COMMANDS')
          else: print(df.head(30).to_string(index=False))
          PY
      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-early-hunter-profit-optimized-engine
          path: output/*.csv
          if-no-files-found: error
          retention-days: 30
      - name: Notify on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not set — skipping failure alert."
            exit 0
          fi
          MSG="NSE Auto Sheet run FAILED: ${{ github.repository }} @ ${{ github.sha }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
