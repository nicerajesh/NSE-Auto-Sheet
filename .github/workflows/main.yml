name: Update NSE Stocks to Google Sheet

on:
  schedule:
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Version
        run: |
          echo "=== NSE EARLY HUNTER BUILD ==="
          echo "COMMIT=$(git rev-parse HEAD)"
          echo "BRANCH=$(git branch --show-current || true)"
          echo "D1 batch implementation:"
          grep -n "def batch\|/raw\|\['batch'\]\|range(0,len(items)" d1_database.py
          echo "D1 file SHA expected latest commit: 01b71c4aa4b79e0bb39c7f61e69c55216fa3b18"
          echo "==============================="

      - name: Unit Tests
        run: python test_system.py

      - name: Run Early Hunter V5 + D1
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: e6652e85-b927-4f11-b790-45fb6ee818f2
          HISTORY_DAYS: 180
          MIN_SCORE: 68
        run: python update_sheet.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-early-hunter-v5
          path: output/*.csv
          if-no-files-found: error
          retention-days: 30
