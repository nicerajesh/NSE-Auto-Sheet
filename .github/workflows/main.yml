name: Update NSE Stocks to Google Sheet

on:
  schedule:
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Engine
        run: |
          echo '=== NSE EARLY HUNTER — PROFIT-OPTIMIZED DECISION ENGINE ==='
          echo "COMMIT=$(git rev-parse HEAD)"
          PYTHONPATH=src python -m py_compile src/config.py src/indicator.py src/strategy.py src/backtest.py src/quality_gate.py src/d1_database.py src/trade_manager.py src/persistent_runner.py src/persistent_runner_safe.py src/v3_engine.py src/v3_runner.py src/decision_engine.py src/v3_dashboard.py src/update_sheet.py src/finalize_outputs.py src/dashboard.py src/repair_sheet_output.py tests/test_system.py src/csv_utils.py src/risk_manager.py src/corporate_actions.py src/edge_monitor.py src/master_decision.py src/run_v2_master.py
          PYTHONPATH=src python - <<'PY'
          from decision_engine import BUY_NOW, BUY_BREAKOUT, BUY_DIP, WAIT, AVOID
          print('USER_ACTIONS=', [BUY_NOW, BUY_BREAKOUT, BUY_DIP, WAIT, AVOID])
          print('DECISION_ENGINE=enabled')
          print('UPSIDE_BANDS=enabled')
          print('CHASE_PROTECTION=enabled')
          PY
      - name: Unit Tests
        run: |
          PYTHONPATH=src python tests/test_system.py
          PYTHONPATH=src pytest -q tests/test_system.py
      - name: Validate Secrets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$GCP_CREDENTIALS" || (echo 'GCP_CREDENTIALS missing' && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN missing' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID missing' && exit 1)
      - name: Prepare Output
        run: |
          rm -rf output
          mkdir -p output
          echo "NSE_OUTPUT_DIR=$GITHUB_WORKSPACE/output" >> "$GITHUB_ENV"
      - name: Run V3 Persistent NSE Engine
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: e6652e85-b927-4f11-b790-45fb6ee818f2
          HISTORY_DAYS: 480
          WATCH_MIN_SCORE: 75
          PERSISTENT_D1: '1'
          PYTHONUNBUFFERED: '1'
          # Money-management defaults to SAFE (paper mode: signals are fully
          # computed/sized/published as normal, but this is a visible marker
          # that no real capital should be assumed committed automatically).
          # Set the repo Variable PAPER_MODE=0 once you're ready to treat
          # published signals as live guidance.
          PAPER_MODE: ${{ vars.PAPER_MODE || '1' }}
        run: python src/v3_runner.py
      - name: Validate Persistent History
        run: |
          test -f output/persistent_history.csv
          python - <<'PY'
          import pandas as pd
          p='output/persistent_history.csv'
          d=pd.read_csv(p)
          required=['SYMBOL','DATE','CLOSE_PRICE','TTL_TRD_QNTY']
          missing=[x for x in required if x not in d.columns]
          if missing: raise SystemExit('Missing persistent history fields: '+','.join(missing))
          if d.empty: raise SystemExit('persistent_history.csv is empty')
          print('PERSISTENT_HISTORY_ROWS=',len(d),'| SESSIONS=',d['DATE'].nunique(),'| SYMBOLS=',d['SYMBOL'].nunique())
          PY
      - name: Validate Decision Outputs
        run: |
          test -f output/early_hunter.csv
          test -f output/buy_candidates.csv
          test -f output/decision_candidates.csv
          test -f output/trading_commands.csv
          test -f output/master_buy_decision_v2.csv
          test -f output/low52_reversal.csv
          test -f output/apex_matrix.csv
          test -f output/stealth_accumulation.csv
          test -f output/low52_backtest_summary.csv
          test -f output/apex_backtest_summary.csv
          test -f output/stealth_backtest_summary.csv
          python - <<'PY'
          import pandas as pd
          e=pd.read_csv('output/early_hunter.csv')
          d=pd.read_csv('output/decision_candidates.csv')
          c=pd.read_csv('output/trading_commands.csv')
          l=pd.read_csv('output/low52_reversal.csv')
          lb=pd.read_csv('output/low52_backtest_summary.csv')
          ab=pd.read_csv('output/apex_backtest_summary.csv')
          sb=pd.read_csv('output/stealth_backtest_summary.csv')
          print('EARLY_HUNTER_ROWS=',len(e))
          print('DECISION_ROWS=',len(d))
          print('TRADING_COMMAND_ROWS=',len(c))
          print('LOW52_REVERSAL_ROWS=',len(l))
          print('LOW52_BACKTEST_TRADES=',lb.get('trades',[0])[0] if not lb.empty else 0, '| PF=',lb.get('profit_factor',[None])[0] if not lb.empty else None)
          print('APEX_BACKTEST_TRADES=',ab.get('trades',[0])[0] if not ab.empty else 0, '| PF=',ab.get('profit_factor',[None])[0] if not ab.empty else None)
          print('STEALTH_BACKTEST_TRADES=',sb.get('trades',[0])[0] if not sb.empty else 0, '| PF=',sb.get('profit_factor',[None])[0] if not sb.empty else None)
          required=['V3_TIMING_SCORE','V3_OPPORTUNITY_SCORE','BREAKOUT_CHANCE_PCT','UPSIDE_EXPECTED_PCT','UPSIDE_BEST_CASE_PCT','USER_ACTION','IDEAL_ENTRY','BUY_ZONE','MAX_BUY_PRICE']
          missing=[x for x in required if x not in d.columns]
          if missing: raise SystemExit('Missing decision fields: '+','.join(missing))
          if not c.empty: print(c.head(15).to_string(index=False))
          PY
      - name: Finalize Quality Gate and Outputs
        run: python src/finalize_outputs.py
      - name: Validate V2 Master Decision
        run: |
          test -f output/master_buy_decision_v2.csv
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('output/master_buy_decision_v2.csv')
          required=['RANK','SYMBOL','FINAL_ACTION','QUALITY_GATE']
          missing=[x for x in required if x not in d.columns]
          if missing: raise SystemExit('Missing V2 master fields: '+','.join(missing))
          bad=d[d.FINAL_ACTION.str.contains('BUY',na=False) & ~d.FINAL_ACTION.str.contains('BLOCKED',na=False)]
          if not bad.empty and (d.loc[bad.index,'QUALITY_GATE'].astype(str)!='PASS').any():
              raise SystemExit('V2 master published BUY without PASS quality gate')
          print('V2 MASTER ROWS=',len(d),'| RELEASED BUY=',len(bad))
          PY
      - name: Repair Google Sheet Output
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          PYTHONUNBUFFERED: '1'
        run: python src/repair_sheet_output.py
      - name: Build Trading Dashboard
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          PYTHONUNBUFFERED: '1'
        run: python src/dashboard.py
      - name: Verify Outputs
        run: |
          test -f output/early_hunter.csv
          test -f output/buy_candidates.csv
          test -f output/dashboard.csv
          test -f output/trade_ledger.csv
          test -f output/decision_candidates.csv
          test -f output/trading_commands.csv
          test -f output/low52_reversal.csv
          test -f output/apex_matrix.csv
          test -f output/stealth_accumulation.csv
          test -f output/master_buy_dashboard.csv
          test -f output/low52_backtest_summary.csv
          test -f output/apex_backtest_summary.csv
          test -f output/stealth_backtest_summary.csv
          test -f output/edge_monitor.csv
          test -f output/walk_forward_summary.csv
          test -f output/corporate_actions_detected.csv
          test -f output/mera_action_plan.csv
      - name: Show Master Buy Dashboard
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/master_buy_dashboard.csv')
          if df.empty:
              print('NO PUBLISHED BUYS FROM ANY SCANNER TODAY')
          else:
              print(df.head(30).to_string(index=False))
          PY
      - name: Show APEX Matrix Candidates
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/apex_matrix.csv')
          if df.empty:
              print('NO APEX MATRIX SETUPS TODAY')
          else:
              print(df.head(30).to_string(index=False))
          PY
      - name: Show 52-Week-Low Reversal Candidates
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/low52_reversal.csv')
          if df.empty:
              print('NO STOCKS CURRENTLY NEAR 52-WEEK LOW WITH A REVERSAL SIGNAL')
          else:
              print(df.head(30).to_string(index=False))
          PY
      - name: Show Stealth Accumulation Candidates
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/stealth_accumulation.csv')
          if df.empty:
              print('NO STEALTH ACCUMULATION SETUPS TODAY')
          else:
              print(df.head(30).to_string(index=False))
          PY
      - name: Show Trading Commands
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('output/trading_commands.csv')
          if df.empty:
              print('NO CURRENT TRADING COMMANDS')
          else:
              print(df.head(30).to_string(index=False))
          PY
      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-early-hunter-profit-optimized-engine
          path: output/*.csv
          if-no-files-found: error
          retention-days: 30
      - name: Notify on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Opt-in: does nothing if TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets
          # aren't set. Without this, a broken run before today just sat there
          # producing no signals with nobody finding out until manually checked.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not set — skipping failure alert. Add them as repo secrets to enable."
            exit 0
          fi
          MSG="NSE Auto Sheet run FAILED: ${{ github.repository }} @ ${{ github.sha }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MSG" || true


# V2 master decision output is generated by the finalization stage.
