name: Update NSE Stocks to Google Sheet

on:
  schedule:
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Next-Day Engine
        run: |
          echo '=== NSE EARLY HUNTER V9 — NEXT DAY PRE-BREAKOUT ==='
          echo "COMMIT=$(git rev-parse HEAD)"
          python -m py_compile config.py indicator.py strategy.py backtest.py quality_gate.py d1_database.py trade_manager.py update_sheet.py
          python - <<'PY'
          from config import STRAT, BT
          from strategy import ACTIONABLE
          print('BUY_SCORE=', STRAT.buy_score)
          print('MIN_STOP=', STRAT.min_stop_pct)
          print('MAX_STOP=', STRAT.max_stop_pct)
          print('MIN_RR2=', STRAT.min_rr2)
          print('BACKTEST_WARMUP=', BT.warmup)
          print('BACKTEST_HORIZON=', BT.horizon)
          print('ACTIONABLE=', sorted(ACTIONABLE))
          PY

      - name: Unit Tests
        run: python test_system.py

      - name: Validate Secrets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$GCP_CREDENTIALS" || (echo 'GCP_CREDENTIALS missing' && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN missing' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID missing' && exit 1)
          echo 'Required secrets: PASS'

      - name: Prepare Output
        run: |
          rm -rf output
          mkdir -p output

      - name: Run Next-Day Pre-Breakout Scanner
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: e6652e85-b927-4f11-b790-45fb6ee818f2
          # The Python loader reserves HISTORY_DAYS + 120 calendar attempts.
          # 480 requests gives enough calendar room to obtain ~420 trading sessions.
          HISTORY_DAYS: 480
          WATCH_MIN_SCORE: 72
          PYTHONUNBUFFERED: '1'
        run: |
          python update_sheet.py

      - name: Verify Output
        run: |
          test -d output || (echo 'output directory missing' && exit 1)
          echo '=== GENERATED OUTPUT ==='
          ls -lah output/
          CSV_COUNT=$(find output -maxdepth 1 -type f -name '*.csv' | wc -l)
          test "$CSV_COUNT" -gt 0 || (echo 'No CSV output generated' && exit 1)
          echo "CSV files: $CSV_COUNT"

      - name: Show Next-Day Candidates
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          files = glob.glob('output/*.csv')
          for f in files:
              try:
                  df = pd.read_csv(f)
                  print('\nFILE:', f, 'ROWS:', len(df))
                  if 'NEXT_DAY_ACTION' in df.columns:
                      print(df[df.NEXT_DAY_ACTION.ne('WATCH')][['SYMBOL','NEXT_DAY_ACTION','BUY_DATE','BREAKOUT_TRIGGER','STOP_LOSS','TARGET_1','TARGET_2','TARGET_3','BREAKOUT_PROBABILITY']].head(30).to_string(index=False))
                  elif 'ACTION' in df.columns:
                      print(df[df.ACTION.isin(['BUY ON BREAKOUT','BREAKOUT IMMINENT','BUY NOW'])].head(30).to_string(index=False))
              except Exception as e:
                  print('Summary warning:', e)
          PY

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-early-hunter-v9-next-day
          path: output/*.csv
          if-no-files-found: error
          retention-days: 30
