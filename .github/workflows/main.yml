name: Update NSE Stocks to Google Sheet
on:
  push:
    branches: [main]
  schedule:
    # 20:15 IST (14:45 UTC), Monday-Friday; after the daily NSE data pipeline window.
    - cron: '45 14 * * 1-5'
  workflow_dispatch:
    inputs:
      full_audit:
        description: 'Run full backtests/validation instead of fast daily refresh'
        required: false
        default: false
        type: boolean
jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
      NSE_OUTPUT_DIR: ${{ github.workspace }}/output
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Engine
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          PYTHONPATH=src python -m py_compile src/config.py src/indicator.py src/strategy.py src/backtest.py src/quality_gate.py src/v6_quality_validation.py src/v7_false_breakout_validation.py src/persistent_runner.py src/v3_engine.py src/v3_runner.py src/decision_engine.py src/v3_dashboard.py src/update_sheet.py src/finalize_outputs.py src/dashboard.py src/repair_sheet_output.py src/fast_model_cache.py src/apply_fast_mode.py src/ensure_action_plan.py src/csv_utils.py src/risk_manager.py src/corporate_actions.py src/edge_monitor.py src/master_decision.py src/run_v2_master.py src/simple_dashboard.py src/core_trend_matrix.py src/publish_strategy_sheets.py
      - name: Unit Tests
        run: PYTHONPATH=src pytest -q tests/test_system.py tests/test_core_trend_matrix.py tests/test_v6_quality_validation.py tests/test_v7_false_breakout_validation.py
      - name: Validate Secrets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: test -n "$GCP_CREDENTIALS" || (echo 'GCP_CREDENTIALS missing' && exit 1)
      - name: Prepare Output
        run: rm -rf output && mkdir -p output
      - name: Restore Persistent NSE History
        uses: actions/cache/restore@v4
        with:
          path: output/persistent_history.csv
          key: nse-persistent-history-v1
          restore-keys: nse-persistent-history-v1-
      - name: Restore Model Validation Cache
        uses: actions/cache/restore@v4
        with:
          path: model_cache
          key: nse-model-cache-v2
          restore-keys: nse-model-cache-v2-
      - name: Apply Fast Model Cache
        env:
          FAST_MODE: ${{ inputs.full_audit == true && '0' || '1' }}
          NSE_MODEL_CACHE_DIR: ${{ github.workspace }}/model_cache
        run: PYTHONPATH=src python src/apply_fast_mode.py
      - name: Run V3 Persistent NSE Engine
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          HISTORY_DAYS: 480
          WATCH_MIN_SCORE: 75
          PERSISTENT_D1: '0'
          FAST_MODE: ${{ inputs.full_audit == true && '0' || '1' }}
          NSE_MODEL_CACHE_DIR: ${{ github.workspace }}/model_cache
          PAPER_MODE: ${{ vars.PAPER_MODE || '1' }}
        run: python src/v3_runner.py
      - name: Validate Engine Output
        run: test -s output/early_hunter.csv && test -s output/persistent_history.csv
      - name: Build Core Trend Matrix
        run: PYTHONPATH=src python src/core_trend_matrix.py --input output/persistent_history.csv --output output/core_trend_matrix.csv
      - name: Validate Core Trend Matrix
        run: python -c "import pandas as pd; d=pd.read_csv('output/core_trend_matrix.csv'); s=pd.read_csv('output/core_trend_matrix_summary.csv'); assert not d.empty; assert {'RANK_SCORE','SYMBOL','ACTION'}<=set(d.columns); print(s.to_string(index=False))"
      - name: Save Persistent NSE History
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/persistent_history.csv
          key: nse-persistent-history-v1-${{ github.run_id }}
      - name: Finalize Quality Gate and Outputs
        run: PYTHONPATH=src python src/finalize_outputs.py
      - name: Build V6 Action OOS Validation
        run: PYTHONPATH=src python src/v6_quality_validation.py
      - name: Build V7 False-Breakout Diagnostics
        run: PYTHONPATH=src python src/v7_false_breakout_validation.py
      - name: Rebuild V2 Master Decision
        run: PYTHONPATH=src python src/run_v2_master.py
      - name: Guarantee V2 Master Schema
        run: |
          python - <<'PY'
          import os,pandas as pd
          p='output/master_buy_decision_v2.csv'; d=pd.read_csv(p) if os.path.exists(p) else pd.DataFrame()
          cols=['RANK','SYMBOL','FINAL_ACTION','CMP','IDEAL_ENTRY','BUY_ZONE','MAX_BUY_PRICE','BREAKOUT_TRIGGER','STOP_LOSS','TARGET_1','TARGET_2','TARGET_3','RISK_PCT','EDGE_CONFIDENCE','EDGE_CONFIDENCE_LABEL','POSITION_QTY','CAPITAL_ALLOCATED','RISK_AMOUNT','RISK_MANAGER_STATUS','QUALITY_GATE','ACTION','WHY','DECISION_REASON']
          for c in cols:
              if c not in d:d[c]=''
          d[cols].to_csv(p,index=False); print('V2 MASTER ROWS',len(d))
          PY
      - name: Build Diagnostic Report
        run: |
          python - <<'PY'
          import pandas as pd, os
          out='output'; h=pd.read_csv(f'{out}/early_hunter.csv'); core=pd.read_csv(f'{out}/core_trend_matrix.csv')
          rows=[]
          def _int_or_zero(v):
              x=pd.to_numeric(v,errors='coerce')
              return int(x) if pd.notna(x) else 0
          for name,d in [('Early Hunter',h),('Core Trend Matrix',core)]:
              act=d['ACTION'].value_counts().to_dict() if 'ACTION' in d else {}
              rows.append({'REPORT':name,'STATUS':'OK' if not d.empty else 'NO DATA','ROWS':len(d),'DETAIL':str(act)})
          if 'PUBLISHED_ACTION' in h:
              for k,v in h.PUBLISHED_ACTION.value_counts(dropna=False).items(): rows.append({'REPORT':'Final Action','STATUS':'OK','ROWS':int(v),'DETAIL':str(k)})
          aq=f'{out}/action_quality_summary.csv'
          if os.path.exists(aq):
              q=pd.read_csv(aq)
              for _,r in q.iterrows():
                  ok=str(r.get('ok','')).strip().lower()=='true'
                  rows.append({'REPORT':'V6 Action OOS','STATUS':'PASS' if ok else 'BLOCKED','ROWS':_int_or_zero(r.get('windows',0)),'DETAIL':str(r.to_dict())})
          v7=f'{out}/v7_false_breakout_validation.csv'
          if os.path.exists(v7):
              q=pd.read_csv(v7)
              for _,r in q.iterrows(): rows.append({'REPORT':'V7 Breakout','STATUS':'RESEARCH','ROWS':_int_or_zero(r.get('TRADES',0)),'DETAIL':str(r.to_dict())})
          pd.DataFrame(rows).to_csv(f'{out}/decision_diagnostic_report.csv',index=False); print(pd.DataFrame(rows).to_string(index=False))
          PY
      - name: Validate Decision Outputs
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('output')
          required_files=['early_hunter.csv','master_buy_decision_v2.csv','low52_reversal.csv','apex_matrix.csv','stealth_accumulation.csv','walk_forward_summary.csv','core_trend_matrix.csv','core_trend_matrix_summary.csv','decision_diagnostic_report.csv','action_walk_forward_summary.csv','action_quality_summary.csv','v7_false_breakout_validation.csv']
          for name in required_files:
              p=out/name
              if not p.exists() or p.stat().st_size==0: raise SystemExit(f'MISSING_OR_EMPTY_REQUIRED {name}')
          h=pd.read_csv(out/'early_hunter.csv'); m=pd.read_csv(out/'master_buy_decision_v2.csv'); b=pd.read_csv(out/'buy_candidates.csv') if (out/'buy_candidates.csv').exists() else pd.DataFrame()
          if h.empty: raise SystemExit('INVALID_TRADING_OUTPUT: early_hunter.csv has no rows')
          if m.empty: raise SystemExit('INVALID_TRADING_OUTPUT: master_buy_decision_v2.csv has no rows')
          for name,df,cols in [('Early Hunter',h,{'SYMBOL','ACTION','QUALITY_GATE','PUBLISHED_ACTION'}),('Master Buy Decision V2',m,{'SYMBOL','FINAL_ACTION','QUALITY_GATE','ACTION'})]:
              missing=cols-set(df.columns)
              if missing: raise SystemExit(f'INVALID_SCHEMA {name}: missing {sorted(missing)}')
          confirmed={'PRE-BREAKOUT BUY','BREAKOUT BUY','SWING BUY'}; published=int(h['PUBLISHED_ACTION'].isin(confirmed).sum()); buy_rows=int(len(b))
          if buy_rows != published: raise SystemExit(f'OUTPUT_MISMATCH: buy_candidates={buy_rows} but published_confirmed={published}')
          blocked=int(h['PUBLISHED_ACTION'].astype(str).str.contains('BLOCKED',case=False,na=False).sum()); no_signal=(published==0)
          print(f'VALIDATION OK | hunter={len(h)} | master={len(m)} | published_buy={published} | buy_candidates={buy_rows} | blocked={blocked} | no_signal={no_signal}')
          if no_signal: print('NO-SIGNAL DAY: valid output; not a data failure. Scanner context remains available in Early Hunter/Master Decision.')
          PY
      - name: Refresh Model Validation Cache
        run: PYTHONPATH=src python -c "from fast_model_cache import copy_current_to_cache; copy_current_to_cache('output')"
      - name: Save Model Validation Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: model_cache
          key: nse-model-cache-v2-${{ github.run_id }}
      - name: Repair Google Sheet Core Output
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python src/repair_sheet_output.py
      - name: Publish Clean Strategy Sheets Only
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python src/publish_strategy_sheets.py
      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-early-hunter-profit-optimized-engine
          path: output/*.csv
          if-no-files-found: error
          retention-days: 30
