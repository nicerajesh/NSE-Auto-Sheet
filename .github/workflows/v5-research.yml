name: RY APEX V5 Historical Research

on:
  workflow_dispatch:
    inputs:
      rebuild_history:
        description: 'Rebuild history from the configured EOD source'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nse-v5-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore existing NSE history cache
        if: ${{ !inputs.rebuild_history }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: nse-state-v2-none
          restore-keys: |
            nse-state-v2-

      - name: Run isolated V5 historical research
        run: python src/run.py --v5-research --no-publish ${{ inputs.rebuild_history && '--rebuild-history' || '' }}

      - name: Upload V5 research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ry-apex-v5-research
          path: output/v5_*.csv
          if-no-files-found: error
          retention-days: 30
